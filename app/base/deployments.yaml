# The five "shop" services. Each runs Kubernetes' resource-consumer test image,
# and the load generator (load/) drives every pod to a fixed CPU and memory
# profile, so everyone in the room sees the same numbers.
# Resources are deliberately absent here: the overlays (bloated/, rightsized/) set them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/resource-consumer:1.13
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5 }
          resources: {}
---
